<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>We ❤ PDF | Every tool you need, in one place</title>
<meta name="description" content="Private PDF toolkit. Merge, split, rotate, organize, edit, fill forms and convert PDFs — everything happens in your browser, files never leave your device.">
<meta name="theme-color" content="#e5322d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hdr">
  <div class="hdr__in">
    <a class="logo" href="#" aria-label="We love PDF home">We<span class="logo__heart" aria-hidden="true">❤</span><span class="logo__pdf">PDF</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#merge" class="nav__lnk">MERGE PDF</a>
      <a href="#split" class="nav__lnk">SPLIT PDF</a>
      <a href="#edit" class="nav__lnk">EDIT PDF</a>
      <a href="#forms" class="nav__lnk">FILL FORMS</a>
      <button class="nav__lnk nav__all" id="navAllBtn" aria-expanded="false">ALL PDF TOOLS <span class="nav__caret">▾</span></button>
    </nav>
    <button class="hdr__burger" id="burgerBtn" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
  <div class="megamenu" id="megamenu" hidden></div>
</header>

<main id="view" class="view"></main>

<footer class="ftr">
  <div class="ftr__in">
    <span>We<span class="logo__heart" aria-hidden="true">❤</span>PDF — your private PDF toolkit.</span>
    <span class="ftr__note">Files are processed entirely in your browser and never leave your device.</span>
  </div>
</footer>

<div class="overlay" id="procOverlay" hidden>
  <div class="overlay__box">
    <div class="spinner" aria-hidden="true"></div>
    <p class="overlay__msg" id="procMsg">Processing…</p>
  </div>
</div>

<div class="dropveil" id="dropVeil" hidden><div class="dropveil__msg">Drop your file here</div></div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fflate.min.js"></script>
<script src="js/app.js"></script>
<script src="js/tools/merge.js"></script>
<script src="js/tools/split.js"></script>
<script src="js/tools/rotate.js"></script>
<script src="js/tools/organize.js"></script>
<script src="js/tools/editor.js"></script>
<script src="js/tools/forms.js"></script>
<script src="js/tools/convert.js"></script>
<script>App.start();</script>
</body>
</html>
